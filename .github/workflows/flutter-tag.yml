name: Android ARM64 Tag Build

on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: Release tag to build and publish
        required: true
        type: string
        default: "1.5.3-1"
  push:
    branches:
      - custom-ipv6-stun
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

permissions:
  contents: write

jobs:
  build-android-arm64:
    uses: ./.github/workflows/android-arm64-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag || github.ref_name }}
